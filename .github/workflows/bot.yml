name: Bloodline Seasons

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN1 }}
        run: node bot.js
